name: iva

services:
  iva:
    image: ${IVA_IMAGE:?IVA_IMAGE is required}
    # The daemon itself is rootless. Container UID 0 maps to the unprivileged
    # host deploy user, preserving access to 0600/0700 bind-mounted state.
    user: "0:0"
    env_file:
      - ${IVA_ENV_FILE:-./.env}
    environment:
      ASSISTANT_HOST: http://iva:8723
      IVA_PORT: "8723"
      PORT: "8723"
      TELEGRAM_USERBOT_RUNTIME: "container"
      TELEGRAM_MCP_URL: http://telegram-userbot:8724/mcp
    ports:
      - "127.0.0.1:8723:8723"
    volumes:
      - ./data:/app/data
      - ./memory:/app/memory
      - ./vault:/app/vault
      - ./.eve:/app/.eve
      - ./.env:/app/.env:ro
    tmpfs:
      - /app/node_modules/.cache/eve:rw,noexec,nosuid,nodev,mode=0700
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8723/eve/v1/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      telegram-userbot:
        condition: service_started
    networks:
      - iva-internal

  telegram-poll:
    image: ${IVA_IMAGE:?IVA_IMAGE is required}
    user: "0:0"
    env_file:
      - ${IVA_ENV_FILE:-./.env}
    environment:
      ASSISTANT_HOST: http://iva:8723
      IVA_PORT: "8723"
      PORT: "8723"
      TELEGRAM_USERBOT_RUNTIME: "container"
      TELEGRAM_MCP_URL: http://telegram-userbot:8724/mcp
    command: ["npm", "run", "poll"]
    depends_on:
      iva:
        condition: service_healthy
      telegram-userbot:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./memory:/app/memory
      - ./vault:/app/vault
      - ./.eve:/app/.eve
      - ./.env:/app/.env:ro
    tmpfs:
      - /app/node_modules/.cache/eve:rw,noexec,nosuid,nodev,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - iva-internal

  telegram-userbot:
    image: ${IVA_IMAGE:?IVA_IMAGE is required}
    # Root is namespaced by the required rootless Docker daemon. It is needed
    # only to initialize the private named volume on first boot.
    user: "0:0"
    environment:
      ASSISTANT_DATA_DIR: /app/data
      PYTHONDONTWRITEBYTECODE: "1"
      TELEGRAM_USERBOT_CREDENTIALS_FILE: /app/data/telegram-userbot.env
      TELEGRAM_SESSION_FILE: /app/userbot-state/telegram-userbot.session
      TELEGRAM_MCP_HOST: "0.0.0.0"
      TELEGRAM_MCP_PORT: "8724"
      TELEGRAM_EXPOSED_TOOLS: "read-only"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
    # Older rollback images predate the sidecar. Keep their placeholder alive so
    # the core bot can recover; only compatible images start the session owner.
    command:
      - /bin/sh
      - -c
      - >-
        if [ -x /opt/iva-userbot-venv/bin/python ] &&
        [ -f /app/services/telegram-userbot/container_supervisor.py ]; then
        exec /opt/iva-userbot-venv/bin/python
        /app/services/telegram-userbot/container_supervisor.py;
        else exec sleep infinity; fi
    volumes:
      - ./data:/app/data:ro
      - telegram-userbot-state:/app/userbot-state
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,size=16m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - iva-internal

networks:
  iva-internal:
    driver: bridge

volumes:
  telegram-userbot-state:
