name: iva

services:
  iva:
    image: ${IVA_IMAGE:?IVA_IMAGE is required}
    # The daemon itself is rootless. Container UID 0 maps to the unprivileged
    # host deploy user, preserving access to 0600/0700 bind-mounted state.
    user: "0:0"
    env_file:
      - ${IVA_ENV_FILE:-./.env}
    environment:
      ASSISTANT_HOST: http://iva:8723
      IVA_PORT: "8723"
      PORT: "8723"
    ports:
      - "127.0.0.1:8723:8723"
    volumes:
      - ./data:/app/data
      - ./memory:/app/memory
      - ./vault:/app/vault
      - ./.eve:/app/.eve
      - ./.env:/app/.env:ro
    tmpfs:
      - /app/node_modules/.cache/eve:rw,noexec,nosuid,nodev,mode=0700
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8723/eve/v1/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - iva-internal

  telegram-poll:
    image: ${IVA_IMAGE:?IVA_IMAGE is required}
    user: "0:0"
    env_file:
      - ${IVA_ENV_FILE:-./.env}
    environment:
      ASSISTANT_HOST: http://iva:8723
      IVA_PORT: "8723"
      PORT: "8723"
    command: ["npm", "run", "poll"]
    depends_on:
      iva:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./memory:/app/memory
      - ./vault:/app/vault
      - ./.eve:/app/.eve
      - ./.env:/app/.env:ro
    tmpfs:
      - /app/node_modules/.cache/eve:rw,noexec,nosuid,nodev,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - iva-internal

networks:
  iva-internal:
    driver: bridge
